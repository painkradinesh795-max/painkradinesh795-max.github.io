<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dinesh's Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            text-align: center;
        }

        header {
            padding: 70px 20px;
            background: linear-gradient(135deg, #111827, #172554);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 18px;
            color: #cbd5e1;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        section {
            padding: 50px 20px;
        }

        .card {
            max-width: 500px;
            margin: 20px auto;
            padding: 25px;
            background: #111827;
            border-radius: 15px;
        }

        footer {
            padding: 25px;
            background: #050814;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to Dinesh's Website</h1>
        <p>My first website created from my iPhone.</p>

        <a href="#about" class="button">Explore</a>
    </header>

    <section id="about">
        <h2>About Me</h2>

        <div class="card">
            <p>
                Hello! My name is Dinesh.
                This is my first website and I am learning
                web development from my mobile.
            </p>
        </div>
    </section>

    <section>
        <h2>Contact</h2>

        <div class="card">
            <p>You can contact me here.</p>
        </div>
    </section>

    <footer>
        © 2026 Dinesh. All Rights Reserved.
    </footer>

</body>
</html>
